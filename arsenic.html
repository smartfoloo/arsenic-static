    var PAGES = [
      '<h2>Kestrel Point</h2><p class="byline">a novella</p><p>The light turned every eleven seconds, and Thomas Ambrose had counted them so many years running that he no longer needed the clock bolted above the stove to know the time. Eleven seconds of dark, then a white blade sweeping the water, then eleven more. He had married his life to that rhythm the way other men married women, and on Kestrel Point that had always seemed the better bargain.</p><p>The island was three acres of granite and gorse, tethered to the mainland by a supply boat that came Tuesdays, weather allowing. In November it rarely allowed. Thomas had provisioned for that, as he provisioned for everything: tinned fish stacked like bricks, paraffin drummed against the damp, a wireless set in the corner of the kitchen that he serviced with the same patience he gave the lamp itself.</p><p>It was the wireless that had started keeping him up nights.</p>',
      '<p>Not the news bulletins, which he took at seven and forgot by eight, but something underneath them, arriving after the station in Plymouth signed off and the band went to static. A pattern. Faint, regular, threading through the hiss like a heartbeat heard through a wall.</p><p>He\'d noticed it first on a Thursday in October, dismissed it as atmospheric noise, the sort of ghost signal that bounced off the ionosphere on cold nights and meant nothing at all. But it came back the next night, and the next, always a little after midnight, always for exactly the same stretch of minutes before it dissolved back into hiss.</p><p>Thomas had kept a log for eleven years — weather, vessel traffic, the mechanical moods of the lamp — and he added a new column without quite deciding to. <em>Signal, 00:14–00:31.</em> Some nights he wrote nothing else. Some nights, when the pattern seemed to shift, he wrote pages, trying to force sense onto something that resisted it.</p><p>He told himself it was only diligence. A keeper noticed things; that was the job description, whether or not the things noticed meant to be found.</p>',
      '<p>Before the island there had been a terrace house in Falmouth, and Elena, and six years that Thomas still measured his life against without meaning to. She had been a wireless operator herself, trained during the war and never quite willing to give it up afterward, and their courtship had been conducted partly in the ordinary way and partly in Morse, tapped out on the edge of the kitchen table when words felt too heavy to say plainly.</p><p><em>Stay</em>, she used to send him, three dots and a dash and a pause, when he talked about the lighthouse service and the postings that would take him away for months. He had gone anyway, because the alternative was a desk in an office that made his chest feel bricked in, and she had understood that better than he explained it, which was its own kind of love.</p><p>She had died in the spring before his last posting, quickly and unfairly, the way it so often goes, and Thomas had taken Kestrel Point four months later because solitude that chooses itself is easier to carry than solitude that arrives on its own.</p><p>He did not think of the wireless as a way of reaching her. He was not a foolish man. But he noticed that the signal had started in October, and that October was the month they\'d married, and he noticed himself noticing, and said nothing to anyone, because there was no one to say it to.</p>',
      '<p>By the second week of November he had a notebook full of dots and dashes that refused to resolve into English, or French, or the maritime code he\'d learned well enough to read distress calls in his sleep. It wasn\'t gibberish — gibberish had no rhythm, and this had rhythm the way a sentence has rhythm before you catch the words.</p><p>He tried it as numbers. He tried it backward. On the eleventh night he tried something he was faintly embarrassed by even alone in his own kitchen: he tried it as if it were old code, the private shorthand he and Elena had built between them, half standard Morse and half invention, spelling out endearments neither of them would have said aloud.</p><p>Three letters surfaced first, unmistakably: <em>K</em>, <em>E</em>, <em>S</em>. He stared at them so long the kettle went cold on the stove.</p><p>Not her name. His posting. Someone, somewhere down the coast, was sending the name of his own lighthouse back to him, and he did not know yet whether that was the least eerie explanation or the most.</p>',
      '<p>The storm came in on the fourteenth, faster than the forecast had promised, the barometer dropping like something falling down a stairwell. Thomas spent the afternoon lashing the boat shed and checking the lamp\'s mechanism twice over, because a keeper\'s first loyalty was never to his own comfort but to the vessels that would be out there trusting his eleven seconds of light to mean the difference between a course correction and a reef.</p><p>By nine the wind had a voice, a long continuous howl through the gap in the rocks the islanders had named, without much affection, the Whistle. Rain came sideways. The generator coughed twice and held. Thomas stood in the lamp room longer than he needed to, watching the beam cut through water that seemed determined to swallow it, and felt the old, clean fear of the job settle into him — not fear of the storm exactly, but fear of failing the thing the storm was testing.</p><p>He did not expect the wireless that night. Storms usually buried the signal entirely, the static so thick that even Plymouth came through like something drowning.</p><p>Instead, at fourteen minutes past midnight, it came through clearer than it ever had.</p>',
      '<p>He took it down with a hand that was not quite steady, and this time the letters arrived in whole words, spaced and patient, as if whoever sent them had finally trusted the channel to hold.</p><p><em>KESTREL POINT LIGHT VISIBLE FROM HERE. WHO KEEPS IT.</em></p><p>Thomas sat with that for a long moment. It was, when he made himself look at it plainly, the least mysterious sentence in the world — a question any operator on that stretch of coast might send another, the ordinary courtesy of two lonely stations checking that someone was awake at the far end of the dark. He had simply never had anyone to send it to him.</p><p>His hand found the key before his mind had finished deciding.</p><p><em>T. AMBROSE KEEPS IT. WHO ASKS.</em></p><p>The reply took longer than he liked, long enough that he began composing the disappointment he\'d feel if it never came, and then the set crackled back to life.</p><p><em>M. OKAFOR. DEVIL\'S SPIT STATION. SEVEN YEARS DECOMMISSIONED BUT SOMEONE HAS TO KEEP THE VALVES WARM.</em></p>',
      '<p>Devil\'s Spit was eleven miles down the coast, a station Thomas had known only as a name on the chart and a dark stretch on nights when its own light had still worked, before the Trinity House budget cuts closed it and left whatever equipment still functioned to rust with dignity. He had not known anyone kept it warm.</p><p>They talked — if the word applied to a conversation built from dots and dashes across a storm — for the better part of an hour. Mira Okafor was not, it emerged, a ghost, an operator\'s widow, or any of the half-formed shapes his mind had been assembling in the dark. She was thirty-one, ran weather relay for a marine survey outfit out of the decommissioned station because the pay was decent and the isolation suited her, and had noticed his light three months ago and started sending to it the way a person might wave at a lit window on a dark road, without much hope of a wave back.</p><p>The earlier signals, the ones he\'d spent a fortnight decoding like scripture, had been nothing stranger than her testing the set after a repair, sending the same string of letters over and over the way you\'d say a word aloud to see if it still worked. <em>KES TREL PO INT</em>, badly spaced, badly sent, meaning nothing at all until tonight, when the storm had cleared enough air between the stations for a proper signal to land.</p><p>Thomas found he was smiling in a way his face had nearly forgotten how to do.</p>',
      '<p>He told her about the log, the eleven-year column of weather and vessels, and after a pause admitted the newer column too, the one he\'d labeled <em>Signal</em> without knowing whose voice he was recording. He did not tell her about Elena, not that night, though something in the shape of what he did say must have carried the outline of it, because Mira\'s reply, when it came, was gentler than the question warranted.</p><p><em>SOUNDS LIKE YOU WERE LISTENING FOR SOMEONE FOR A WHILE BEFORE I CAME ALONG.</em></p><p>He looked at that for a long time before he answered, the lamp turning its patient eleven seconds through the window behind him, the storm easing at last into ordinary rain.</p><p><em>SUPPOSE I WAS. GOOD PRACTICE, THOUGH. MADE ME QUICK ENOUGH TO CATCH YOU.</em></p><p>Her laugh did not travel down a wire in dots and dashes, but he heard it anyway, in the particular quickness of the reply that followed, and in something that had loosened in his own chest for the first time in longer than he wanted to count.</p>',
      '<p>They agreed, before the band went back to static near two in the morning, to a standing time — half past midnight, when Plymouth signed off and the channel was theirs. Not every night; Mira\'s relay work had its own demands, and Thomas would not let the lamp\'s needs come second to anything, not even this. But a fixed point, all the same, the kind two people build a week around without quite calling it that yet.</p><p>He went up to check the lamp once more before he let himself sleep, out of habit more than need, and stood a while in the small glass room watching the beam go out over water that had calmed to a sullen swell. Eleven miles down the coast, he knew now, another light was dark and another person was awake anyway, keeping valves warm for no one who\'d asked her to, the way he\'d kept a log for a signal he could not have explained to anyone who\'d asked him to justify it.</p><p>It occurred to him, not for the first time but freshly, that the sea did this — took two isolations and, if you were patient and a little lucky, ran a wire between them.</p>',
      '<p>Winter came in properly after that, the way it always did on Kestrel Point, sealing the island under short grey days and long black ones, and Thomas kept the light exactly as he always had, eleven seconds of dark and a white blade over the water. But the log had a new shape to it now. Weather. Vessels. And under <em>Signal</em>, no longer a mystery to be decoded but an appointment to be kept — half past midnight, most nights, two operators trading the small news of small islands until the static came back to reclaim the channel.</p><p>He did not know yet what the spring would make of it, whether an eleven-mile stretch of cold water could be crossed by anything sturdier than dots and dashes, or whether it would stay exactly what it was, which was already more than he\'d let himself want in a long time. He found, turning the question over the way he turned the pages of the log, that he did not need to answer it tonight.</p><p>The light kept turning. Somewhere down the coast, another keeper who was not a keeper of anything but her own choosing was keeping valves warm and, he suspected, watching for his beam the way he had once, without knowing it, been watching for hers.</p><p class="end">The End</p>'
